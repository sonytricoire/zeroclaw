name: Fork Publish

# Fork-local surface. Do not send upstream (see zeroclaw-labs/zeroclaw#7952).
#
# Publishes the fork's custom feature selection to the fork's own GHCR
# namespace. Upstream's docker-publish.yml cannot do this: all three of its
# jobs are gated on `github.repository == 'zeroclaw-labs/zeroclaw'`, so they
# skip on a fork regardless of branch.
#
# Why a new file rather than an edit to docker-publish.yml: upstream touches
# that file, so editing it would re-conflict on every sync. A file upstream
# does not know about rebases cleanly forever.
#
# Why tag-driven rather than workflow_dispatch: GitHub only exposes
# workflow_dispatch for workflows living on the default branch, and master is
# deliberately kept a pure upstream mirror. A tag push runs the workflow from
# the tagged tree, so this file triggers while existing only on this branch.
#
#   git tag fork-v0.8.4 && git push origin fork-v0.8.4
on:
  push:
    tags:
      - "fork-v*"

concurrency:
  group: fork-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Derived from the repository so a re-fork under another account stays
  # correct, but deliberately NOT `${{ github.repository }}` on its own.
  #
  # A GHCR package named exactly after a fork resolves through the upstream
  # fork network, where the actor holds only read, and GITHUB_TOKEN is refused:
  #
  #   denied: permission_denied: write_package
  #
  # Verified by pushing one alpine layer under both names from the same job:
  # `sonytricoire/zeroclaw` was denied, `sonytricoire/zeroclaw-slack` pushed.
  # Any name outside the fork network works; this one also says what it is.
  IMAGE: ${{ github.repository }}-slack
  # Which docker-tags.toml entry to build. `dist` is the selection this fork
  # patches to include channel-slack, and the only one that ships arm64.
  STEM: dist

jobs:
  matrix:
    name: Resolve tag matrix
    # Inverse of upstream's guard: if this branch ever lands upstream, the
    # workflow must publish nothing rather than push to the canonical namespace.
    if: github.repository != 'zeroclaw-labs/zeroclaw'
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.read.outputs.include }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select the fork's stem from the generated tag matrix
        id: read
        run: |
          set -euo pipefail
          # Same canonical source upstream consumes, filtered to one stem so a
          # fork publish never rebuilds the whole upstream matrix.
          include="$(yq -o=json -I=0 \
            '[.tags[] | select(.stem == strenv(STEM))]' dev/ci/docker-tags.toml)"
          if [ "${include}" = "[]" ]; then
            echo "error: no docker-tags.toml entry with stem '${STEM}'" >&2
            exit 1
          fi
          echo "include=${include}" >> "$GITHUB_OUTPUT"

      - name: Fail if the selection lost the fork's channels
        run: |
          set -euo pipefail
          # The whole point of the fork patch. If a rebase silently drops it,
          # stop here rather than publishing an image that quietly lacks Slack.
          features="$(yq -r \
            '.tags[] | select(.stem == strenv(STEM)) | .features' dev/ci/docker-tags.toml)"
          echo "${STEM} features: ${features}"
          case ",${features}," in
            *,channel-slack,*) echo "channel-slack present" ;;
            *) echo "error: channel-slack missing from '${STEM}' selection" >&2; exit 1 ;;
          esac

  publish:
    name: Build & push ${{ matrix.stem }}
    if: github.repository != 'zeroclaw-labs/zeroclaw'
    needs: [matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Straight from the generated matrix: the Dockerfile cross-compiles to
          # arm64 on the native amd64 builder, so no QEMU step is needed.
          # Tags mirror upstream's names; the `-slack` package name is what
          # keeps these apart from upstream's Slack-less `dist` images.
          platforms: ${{ matrix.platforms }}
          build-args: |
            ZEROCLAW_CARGO_FLAGS=${{ matrix.flags }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.floating_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.pinned_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}

  publish-debian:
    name: Build & push ${{ matrix.stem }} (debian, arm64)
    if: github.repository != 'zeroclaw-labs/zeroclaw'
    needs: [matrix]
    # Native arm64. Dockerfile.debian builds in the target's own userland rather
    # than cross-compiling like Dockerfile does, so an arm64 layer on an amd64
    # runner would go through QEMU and a Rust build there does not finish inside
    # any sane timeout. GitHub offers this runner free on public repositories.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.18.0
        with:
          context: .
          # Deliberately NOT matrix.dockerfile: the generated matrix only ever
          # names the distroless Dockerfile. The shell-equipped variant is not a
          # tag stem upstream publishes, so it is named here while every build
          # flag still comes from the same matrix row.
          file: Dockerfile.debian
          push: true
          platforms: linux/arm64
          build-args: |
            ZEROCLAW_CARGO_FLAGS=${{ matrix.flags }}
          # `-debian` mirrors upstream's name for the shell-equipped variant;
          # the `-slack` package name is what keeps the two apart.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.floating_tag }}-debian
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.pinned_tag }}-debian
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}-debian
